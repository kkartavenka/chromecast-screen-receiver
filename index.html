<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Screen Mirroring Receiver</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <video id="videoPlayer" autoplay></video>

    <div id="statusOverlay">
        <div class="status-title">Screen Mirroring</div>
        <div class="spinner"></div>
        <div id="statusMessage" class="status-message">Connecting...</div>
    </div>

    <div id="errorOverlay">
        <div style="font-size: 48px; margin-bottom: 20px;">⚠️</div>
        <div style="font-size: 24px; font-weight: bold; margin-bottom: 10px;">Playback Error</div>
        <div id="errorMessage" style="font-size: 18px;"></div>
    </div>

    <!-- Google Cast SDK (explicit HTTPS so file:// loads still fetch correctly) -->
    <script src="https://www.gstatic.com/cast/sdk/libs/caf_receiver/v3/cast_receiver_framework.js"></script>
    <script src="app.js"></script>
</body>
</html>
