<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Screen Mirror Receiver</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #000; overflow: hidden; font-family: Arial, sans-serif; }
        #video { 
            width: 100vw; 
            height: 100vh; 
            object-fit: contain; 
            display: block;
        }
        #status { 
            position: absolute; 
            top: 20px; 
            left: 20px; 
            color: #fff; 
            background: rgba(0,0,0,0.7); 
            padding: 15px 25px; 
            border-radius: 8px;
            font-size: 18px;
            z-index: 1000;
            transition: opacity 0.3s;
        }
        #status.error { background: rgba(220,53,69,0.9); }
        #status.ready { background: rgba(40,167,69,0.9); }
        #status.info { background: rgba(0,123,255,0.9); }
    </style>
</head>
<body>
    <video id="video" autoplay playsinline></video>
    <div id="status">Initializing...</div>

    <script src="//www.gstatic.com/cast/sdk/libs/caf_receiver/v3/cast_receiver_framework.js"></script>
    <script>
        const statusEl = document.getElementById('status');
        const videoEl = document.getElementById('video');
        
        let peerConnection = null;
        let senderIp = null;
        let signalingPort = 8888;
        let pollingInterval = null;

        const iceServers = [
            { urls: 'stun:stun.l.google.com:19302' },
            { urls: 'stun:stun1.l.google.com:19302' }
        ];

        function updateStatus(message, type = 'info') {
            console.log(`[${type.toUpperCase()}] ${message}`);
            statusEl.textContent = message;
            statusEl.className = type;
            
            // Auto-hide status after successful connection
            if (type === 'ready') {
                setTimeout(() => {
                    statusEl.style.opacity = '0';
                }, 3000);
            } else {
                statusEl.style.opacity = '1';
            }
        }

        async function httpGet(path) {
            const url = `http://${senderIp}:${signalingPort}${path}`;
            console.log(`📥 HTTP GET ${url}`);
            
            try {
                const response = await fetch(url);
                if (!response.ok) {
                    console.warn(`HTTP ${response.status}: ${path}`);
                    return null;
                }
                return await response.json();
            } catch (error) {
                console.error(`HTTP GET error for ${path}:`, error);
                return null;
            }
        }

        async function httpPost(path, data) {
            const url = `http://${senderIp}:${signalingPort}${path}`;
            console.log(`📤 HTTP POST ${url}`, data);
            
            try {
                const response = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
                
                if (!response.ok) {
                    console.error(`HTTP ${response.status}: ${path}`);
                    return false;
                }
                return true;
            } catch (error) {
                console.error(`HTTP POST error for ${path}:`, error);
                return false;
            }
        }

        async function pollForIceCandidates() {
            if (!peerConnection) return;
            
            const data = await httpGet('/ice-candidate');
            if (data && data.candidates && data.candidates.length > 0) {
                console.log(`📥 Received ${data.candidates.length} ICE candidate(s) from sender`);
                
                for (const candidateJson of data.candidates) {
                    try {
                        const candidate = JSON.parse(candidateJson);
                        await peerConnection.addIceCandidate(new RTCIceCandidate(candidate));
                        console.log('✅ Added sender ICE candidate');
                    } catch (error) {
                        console.error('❌ Failed to add ICE candidate:', error);
                    }
                }
            }
        }

        async function startWebRTC() {
            updateStatus('Creating WebRTC connection...', 'info');

            // Create peer connection
            peerConnection = new RTCPeerConnection({ iceServers });

            // Handle incoming media stream
            peerConnection.ontrack = (event) => {
                console.log('📺 Received remote track:', event.track.kind);
                if (event.streams && event.streams[0]) {
                    videoEl.srcObject = event.streams[0];
                    updateStatus('Connected - Streaming!', 'ready');
                }
            };

            // Handle ICE candidates
            peerConnection.onicecandidate = (event) => {
                if (event.candidate) {
                    console.log('📤 Sending ICE candidate to sender');
                    const candidateJson = JSON.stringify(event.candidate.toJSON());
                    httpPost('/ice-candidate', { candidate: candidateJson });
                } else {
                    console.log('✅ ICE gathering complete');
                }
            };

            // Handle connection state
            peerConnection.onconnectionstatechange = () => {
                console.log('🔗 Connection state:', peerConnection.connectionState);
                
                switch (peerConnection.connectionState) {
                    case 'connected':
                        updateStatus('Connected - Streaming!', 'ready');
                        break;
                    case 'disconnected':
                        updateStatus('Disconnected', 'info');
                        break;
                    case 'failed':
                        updateStatus('Connection failed', 'error');
                        setTimeout(attemptReconnect, 2000);
                        break;
                    case 'closed':
                        updateStatus('Connection closed', 'info');
                        break;
                }
            };

            // Fetch SDP offer from sender
            updateStatus('Fetching offer from sender...', 'info');
            console.log('📥 Fetching SDP offer from sender...');
            
            let offer = null;
            let attempts = 0;
            while (!offer && attempts < 10) {
                offer = await httpGet('/offer');
                if (!offer) {
                    console.log(`Waiting for offer... (attempt ${attempts + 1}/10)`);
                    await new Promise(resolve => setTimeout(resolve, 500));
                    attempts++;
                }
            }

            if (!offer || !offer.sdp) {
                updateStatus('Failed to get offer from sender', 'error');
                console.error('❌ No offer received from sender');
                return;
            }

            console.log('✅ Received SDP offer from sender');

            // Set remote description (offer)
            await peerConnection.setRemoteDescription({
                type: 'offer',
                sdp: offer.sdp
            });
            console.log('✅ Set remote description');

            // Create and set local description (answer)
            const answer = await peerConnection.createAnswer();
            await peerConnection.setLocalDescription(answer);
            console.log('✅ Created SDP answer');

            // Send answer to sender
            updateStatus('Sending answer to sender...', 'info');
            const success = await httpPost('/answer', {
                type: 'answer',
                sdp: answer.sdp
            });

            if (success) {
                console.log('✅ Sent SDP answer to sender');
                updateStatus('Waiting for connection...', 'info');
                
                // Start polling for ICE candidates
                pollingInterval = setInterval(pollForIceCandidates, 500);
            } else {
                updateStatus('Failed to send answer', 'error');
                console.error('❌ Failed to send answer to sender');
            }
        }

        function attemptReconnect() {
            if (peerConnection) {
                peerConnection.close();
                peerConnection = null;
            }
            if (pollingInterval) {
                clearInterval(pollingInterval);
                pollingInterval = null;
            }
            updateStatus('Reconnecting...', 'info');
            setTimeout(startWebRTC, 1000);
        }

        async function autoDiscoverSender() {
            updateStatus('Auto-discovering sender IP...', 'info');
            console.log('🔍 Starting IP auto-discovery...');
            
            // Get our own IP to determine the subnet
            // Try common private network ranges
            const baseIPs = [];
            
            // Try 192.168.x.x range (most common)
            for (let i = 0; i <= 255; i++) {
                baseIPs.push(`192.168.1.${i}`);
                baseIPs.push(`192.168.0.${i}`);
                baseIPs.push(`192.168.2.${i}`);
            }
            
            // Try 10.x.x.x range - expanded to cover more subnets
            for (let j = 0; j <= 255; j++) {
                for (let k of [0, 1, 10, 20, 50, 58, 91, 100]) { // Common third octets
                    baseIPs.push(`10.${j}.${k}.1`);
                    baseIPs.push(`10.${j}.${k}.2`);
                    baseIPs.push(`10.${j}.${k}.10`);
                    baseIPs.push(`10.${j}.${k}.42`); // Common host numbers
                    baseIPs.push(`10.${j}.${k}.100`);
                }
            }
            
            // Try 172.16-31.x.x range (private range)
            for (let j = 16; j <= 31; j++) {
                for (let k = 0; k <= 10; k++) {
                    baseIPs.push(`172.${j}.${k}.1`);
                    baseIPs.push(`172.${j}.${k}.10`);
                }
            }
            
            console.log(`🔍 Testing ${baseIPs.length} possible sender IPs...`);
            
            // Test IPs in parallel (but limit concurrency)
            const batchSize = 50;
            for (let i = 0; i < baseIPs.length; i += batchSize) {
                const batch = baseIPs.slice(i, i + batchSize);
                const results = await Promise.allSettled(
                    batch.map(async (ip) => {
                        try {
                            const controller = new AbortController();
                            const timeout = setTimeout(() => controller.abort(), 150);
                            
                            const response = await fetch(`http://${ip}:8888/health`, {
                                signal: controller.signal
                            });
                            
                            clearTimeout(timeout);
                            
                            if (response.ok) {
                                return ip;
                            }
                        } catch {
                            // Ignore errors
                        }
                        return null;
                    })
                );
                
                const found = results.find(r => r.status === 'fulfilled' && r.value);
                if (found && found.value) {
                    senderIp = found.value;
                    console.log(`✅ Found sender at ${senderIp}!`);
                    updateStatus(`Found sender at ${senderIp}`, 'ready');
                    return true;
                }
            }
            
            updateStatus('Could not find sender IP', 'error');
            console.error('❌ Failed to auto-discover sender IP');
            return false;
        }

        function handleStopStream() {
            if (peerConnection) {
                peerConnection.close();
                peerConnection = null;
            }
            if (pollingInterval) {
                clearInterval(pollingInterval);
                pollingInterval = null;
            }
            videoEl.srcObject = null;
            updateStatus('Stream stopped', 'info');
        }

        // Initialize Cast Receiver
        const castReceiverContext = cast.framework.CastReceiverContext.getInstance();
        
        // Get sender IP from launch data
        castReceiverContext.addEventListener(
            cast.framework.system.EventType.READY,
            (event) => {
                console.log('📡 Cast receiver ready');
                
                // Try to get sender IP from launch data
                const launchData = castReceiverContext.getApplicationData();
                console.log('Launch data:', launchData);
                
                if (launchData) {
                    try {
                        const data = typeof launchData === 'string' ? JSON.parse(launchData) : launchData;
                        senderIp = data.senderIp;
                        signalingPort = data.port || 8888;
                        console.log(`✅ Got sender IP: ${senderIp}:${signalingPort}`);
                    } catch (error) {
                        console.error('Failed to parse launch data:', error);
                    }
                }
                
                if (!senderIp) {
                    // Fallback: try common local IP ranges
                    console.warn('⚠️ No sender IP in launch data, will try to auto-discover');
                    // Try to discover sender by attempting health checks on common IPs
                    setTimeout(async () => {
                        const found = await autoDiscoverSender();
                        if (found && senderIp) {
                            // If we found it before sender connects, wait for sender
                            updateStatus('Waiting for sender to connect...', 'info');
                        }
                    }, 500);
                }
            }
        );

        castReceiverContext.addEventListener(
            cast.framework.system.EventType.SENDER_CONNECTED,
            async (event) => {
                console.log('👤 Sender connected:', event.senderId);
                
                if (!senderIp) {
                    updateStatus('Auto-discovering sender...', 'info');
                    await autoDiscoverSender();
                }
                
                if (senderIp) {
                    updateStatus(`Connecting to ${senderIp}...`, 'info');
                    // Wait a moment for sender to be ready
                    setTimeout(startWebRTC, 1000);
                } else {
                    updateStatus('Could not find sender', 'error');
                }
            }
        );

        castReceiverContext.addEventListener(
            cast.framework.system.EventType.SENDER_DISCONNECTED,
            (event) => {
                console.log('👤 Sender disconnected:', event.senderId);
                handleStopStream();
            }
        );

        // Start the receiver
        const options = new cast.framework.CastReceiverOptions();
        options.disableIdleTimeout = true;
        
        console.log('🚀 Starting Cast Receiver...');
        castReceiverContext.start(options);
        updateStatus('Ready - Waiting for sender...', 'ready');
        
        console.log('✅ Cast Receiver initialized');
    </script>
</body>
</html>
