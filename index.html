<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Screen Mirroring Receiver</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='10' fill='%23000'/%3E%3Cpath d='M12 46h6a12 12 0 0 1 12 12v6H12zM12 34h10a20 20 0 0 1 20 20v10H12zM12 22h14a28 28 0 0 1 28 28v14H12z' fill='%23ffffff'/%3E%3Ccircle cx='18' cy='46' r='4' fill='%23ffffff'/%3E%3C/svg%3E">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <video id="videoPlayer" autoplay></video>

    <div id="statusOverlay">
        <div class="status-title">Screen Mirroring</div>
        <div class="spinner"></div>
        <div id="statusMessage" class="status-message">Connecting...</div>
    </div>

    <div id="errorOverlay">
        <div style="font-size: 48px; margin-bottom: 20px;">⚠️</div>
        <div style="font-size: 24px; font-weight: bold; margin-bottom: 10px;">Playback Error</div>
        <div id="errorMessage" style="font-size: 18px;"></div>
    </div>

    <!-- Google Cast SDK (explicit HTTPS so file:// loads still fetch correctly) -->
    <script src="https://www.gstatic.com/cast/sdk/libs/caf_receiver/v3/cast_receiver_framework.js"></script>
    <script src="app.js"></script>
</body>
</html>
